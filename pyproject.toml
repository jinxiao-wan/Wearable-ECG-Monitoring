[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wearable-ecg-monitoring"
version = "0.1.0"
description = "Reconstructed wearable ECG acquisition and offline analysis prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.scripts]
ecg-analyze = "ecg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
